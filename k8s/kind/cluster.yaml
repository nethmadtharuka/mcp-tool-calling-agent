# Local cluster that enforces NetworkPolicy (Docker Desktop's doesn't).
# kind's default CNI (kindnet) is disabled; Calico is installed instead.
#
#   kind create cluster --config k8s/kind/cluster.yaml     # context: kind-mcp-agent
#   kubectl --context kind-mcp-agent create -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml
#
# Pinned: kind v0.33.0, node image below (Kubernetes 1.34, same minor as
# docker-desktop), Calico v3.32.2. See README "8f".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mcp-agent
networking:
  disableDefaultCNI: true
  # Calico's default IP pool in calico.yaml.
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
