# The agent API, from the same Dockerfile and .dockerignore as compose
# (only app/ and requirements.txt go in; no secrets in the image):
#   docker build -t mcp-agent:0.1.0 .
# Locally built: fixed tag + IfNotPresent (kind: `kind load docker-image mcp-agent:0.1.0`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: mcp-agent
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The Dockerfile's `app` user; numeric so Kubernetes can verify
        # non-root. Group comes from the image (app, gid 999), as in compose.
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: mcp-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          # Non-secret settings (LLM_PROVIDER=mock, ...). MCP URLs come from
          # the config.py defaults: the github-mcp / filesystem-mcp Services.
          envFrom:
            - configMapRef: {name: agent-config}
          # Only these two keys, only into this pod. optional: the app
          # treats both as optional (mock needs no key, no PAT = no GitHub).
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: agent-secrets, key: LLM_API_KEY, optional: true}
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: {name: agent-secrets, key: GITHUB_PERSONAL_ACCESS_TOKEN, optional: true}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}  # ~127Mi measured under compose
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          # GET /health (app/api/routes.py). It doesn't check the MCP
          # servers - the agent works without them (Phase 6), so it stays ready.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        # compose's `tmpfs: [/tmp]`
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
# In-cluster only. From the host: kubectl -n mcp-agent port-forward svc/agent 8000:8000
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: mcp-agent
spec:
  type: ClusterIP
  selector: {app: agent}
  ports:
    - {name: http, port: 8000, targetPort: http}
