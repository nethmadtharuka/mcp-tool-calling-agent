name: Backend CI

on:
  push:
    paths-ignore: ["frontend/**", "design/**", "**.md"]
  pull_request:
    paths-ignore: ["frontend/**", "design/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format github

      # Unit + static manifest tests only: mock LLM, fake MCP servers, no
      # network, no secrets. The live Docker/Kubernetes suites skip
      # themselves unless DOCKER_TESTS / K8S_TESTS are set.
      - name: Test with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml

      - name: Coverage summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
              print(f"### Backend line coverage: {rate:.1f}%")
          except FileNotFoundError:
              print("### Backend coverage: not produced (tests did not run)")
          EOF

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: backend-test-reports
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Build images & validate compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # compose reads env_file: .env; CI uses a placeholder with no secrets.
      - name: Validate compose files
        run: |
          printf 'LLM_PROVIDER=mock\n' > .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Build agent image
        run: docker build -t mcp-agent:ci .

      - name: Build filesystem-mcp images
        run: |
          docker build -t filesystem-mcp:ci filesystem-mcp
          docker build -f filesystem-mcp/Dockerfile.k8s -t filesystem-mcp-k8s:ci .

      - name: Image contains no secrets or project extras
        run: |
          test "$(docker run --rm --entrypoint ls mcp-agent:ci -A /app | tr '\n' ' ')" = "app requirements.txt "
          ! docker run --rm --entrypoint sh filesystem-mcp-k8s:ci -c 'test -e /projects/mcp-tool-calling-agent/.env'
