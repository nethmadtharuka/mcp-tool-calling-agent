name: Live integration (Docker Compose)

# Manual only: starts the real three-container stack and runs
# tests/test_live_docker.py against it. Mock LLM, no GitHub token, no
# secrets: the filesystem MCP checks run for real, GitHub checks skip.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose stack + live tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Start the stack (mock LLM)
        run: |
          printf 'LLM_PROVIDER=mock\n' > .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Live tests
        env:
          DOCKER_TESTS: "1"
        run: pytest tests/test_live_docker.py -v

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
